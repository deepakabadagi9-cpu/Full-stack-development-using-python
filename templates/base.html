<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(% block title %)BookShrlf (%endblock %)</title>
</head>
<body>
    <nav>
        <a class="brand" href="(% url 'book_list' %)"> BookShelf</a>
        <div>
            (% if user.is_authonticated %)
            <a href="(% url 'book_add' %)">Add Book</a>
            <a href="(% url 'logout' %)"></a>
            (% endif %)
        </div>
    </nav>
    <div class="container">
        {% if message %}
            <ul class="messages">
                {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
